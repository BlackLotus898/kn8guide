name: Sync Social Announcements

# Checks the official KAIJU NO. 8 THE GAME news page (info.kj8-thegame.com)
# for new posts and appends them to data/announcements.json as "game" type
# entries.
#
# (Instagram/RSS.app-based sync retired 2026-09-11 -- both RSS.app and
# FeedSpot gate Instagram-to-RSS conversion behind a paid subscription,
# which isn't viable for this project. X/Nitter-based sync was removed
# 2026-08-29 -- the Nitter bridge network it depended on had died.
# This workflow now scrapes the game's own official news page directly
# instead of going through any social platform. See the top of
# sync_official_announcements.py for details and a note on what to check
# if this ever starts failing.)

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:        # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run official site sync script
        run: python .github/scripts/sync_official_announcements.py
        continue-on-error: true

      - name: Commit changes if any
        run: |
          git config user.name "kn8guide-bot"
          git config user.email "actions@github.com"
          git add data/announcements.json data/.official_seen_ids.json
          git diff --staged --quiet || git commit -m "Auto-update: new official site announcements"
          git push
