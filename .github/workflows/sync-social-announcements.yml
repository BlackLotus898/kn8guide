name: Sync Social Announcements

# Checks the official Kaiju No. 8 The Game Instagram account for new posts
# and appends them to data/announcements.json as "game" type entries.
#
# IMPORTANT — this step is experimental/fragile:
# Instagram offers no free, official way to read a public account's posts.
# This workflow relies on an unofficial internal API endpoint that can
# break or get blocked at any time with no warning (datacenter IPs like
# GitHub Actions runners are prime targets for this). The script has a
# built-in fallback to an RSS.app-generated feed if that primary method
# fails — see RSS_APP_FEED_URL in sync_instagram_announcements.py for
# setup. If this step starts failing in the Actions tab, check the
# comments at the top of that script for details on why and what to
# check first.
#
# (X/Nitter-based sync was removed 2026-08-29 — the Nitter bridge network
# it depended on had died. See site-update-log for context if reviving it
# is ever worth revisiting.)

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:        # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run Instagram sync script
        run: python .github/scripts/sync_instagram_announcements.py
        continue-on-error: true

      - name: Commit changes if any
        run: |
          git config user.name "kn8guide-bot"
          git config user.email "actions@github.com"
          git add data/announcements.json
          git diff --staged --quiet || git commit -m "Auto-update: new social announcements"
          git push
